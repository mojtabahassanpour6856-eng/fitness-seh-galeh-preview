name: Build and deploy isolated mobile preview

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "fitness-seh-galeh-preview-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v4

      - name: Checkout isolated staging source
        uses: actions/checkout@v4
        with:
          repository: mojtabahassanpour6856-eng/fitness-seh-galeh-test
          ref: staging/recovery-ui-safe-webp-2026-11-26
          path: site
          persist-credentials: false

      - name: Checkout MuscleMap anatomy integration source
        uses: actions/checkout@v4
        with:
          repository: mojtabahassanpour6856-eng/fitness-seh-galeh-test
          ref: experiment/musclemap-integration-20261127
          path: anatomy-source
          persist-credentials: false

      - name: Add MuscleMap anatomy preview without changing the existing preview
        run: |
          mkdir -p site/anatomy
          cp -R anatomy-source/experiments/musclemap-integration/. site/anatomy/
          node --check anatomy-source/experiments/musclemap-integration/app.js
          node -e "const d=require('./anatomy-source/experiments/musclemap-integration/assets/diagrams.json'); for (const n of ['male-front','male-back','female-front','female-back']) { if (!d[n] || !d[n].muscles.length) throw new Error('missing '+n); } console.log('MuscleMap anatomy data validated');"
          test -s site/anatomy/assets/male-front.webp.b64
          test -s site/anatomy/assets/male-back.webp.b64

      - name: Validate recovery preview contract
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run static safety test
        working-directory: site
        run: node tests/auth-recovery-preview-static.test.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy isolated preview
        id: deployment
        uses: actions/deploy-pages@v4
