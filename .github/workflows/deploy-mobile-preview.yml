name: Build and deploy isolated mobile preview

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "fitness-seh-galeh-preview-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v4

      - name: Checkout isolated staging source
        uses: actions/checkout@v4
        with:
          repository: mojtabahassanpour6856-eng/fitness-seh-galeh-test
          ref: staging/recovery-ui-safe-webp-2026-11-26
          path: site
          persist-credentials: false

      - name: Checkout anatomy prototype source
        uses: actions/checkout@v4
        with:
          repository: mojtabahassanpour6856-eng/fitness-seh-galeh-test
          ref: experiment/anatomy-v2-chest-deltoid-preview-20261127
          path: anatomy-source
          persist-credentials: false

      - name: Add anatomy preview without changing the existing preview
        run: |
          mkdir -p site/anatomy
          cp -R anatomy-source/experiments/smart-anatomy-v2-chest-deltoid/. site/anatomy/

      - name: Validate recovery preview contract
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run static safety test
        working-directory: site
        run: node tests/auth-recovery-preview-static.test.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy isolated preview
        id: deployment
        uses: actions/deploy-pages@v4
