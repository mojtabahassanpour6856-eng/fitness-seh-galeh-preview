name: Build and deploy isolated mobile preview

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "fitness-seh-galeh-preview-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v4

      - name: Checkout isolated staging source
        uses: actions/checkout@v4
        with:
          repository: mojtabahassanpour6856-eng/fitness-seh-galeh-test
          ref: staging/recovery-ui-safe-webp-2026-11-26
          path: site
          persist-credentials: false

      - name: Checkout MuscleMap anatomy integration source
        uses: actions/checkout@v4
        with:
          repository: mojtabahassanpour6856-eng/fitness-seh-galeh-test
          ref: experiment/musclemap-integration-20261127
          path: anatomy-source
          persist-credentials: false

      - name: Set up Node for anatomy validation
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add and validate the latest MuscleMap anatomy preview without changing the existing preview
        run: |
          mkdir -p site/anatomy
          cp -R anatomy-source/experiments/musclemap-integration/. site/anatomy/
          node --check anatomy-source/experiments/musclemap-integration/app.js
          node --check site/anatomy/app.js
          node -e "const fs=require('fs'); const base='./anatomy-source/experiments/musclemap-integration/assets/'; const d=require(base+'diagrams.json'); for (const n of ['male-front','male-back','female-front','female-back']) { const x=d[n]; if (!x || !x.muscles.length || !x.outline.length || !x.viewBox) throw new Error('invalid diagram '+n); if (x.muscles.some(m=>!m.id||!m.group||!m.d)) throw new Error('invalid muscle path '+n); const b=fs.readFileSync(base+n+'.webp.b64','utf8').trim(); const img=Buffer.from(b,'base64'); if (img.length<1000 || img.toString('ascii',8,12)!=='WEBP') throw new Error('invalid WebP '+n); console.log(n+' '+x.muscles.length+' muscle paths; WebP '+img.length+' bytes'); } const app=fs.readFileSync('site/anatomy/app.js','utf8'); const ex=app.match(/const exercises=\\[([\\s\\S]*?)\\n\\];/); if (!ex || (ex[1].match(/\\{id:/g)||[]).length!==71) throw new Error('exercise catalogue count mismatch'); console.log('71 exercise mappings validated');"
          test -s site/anatomy/assets/male-front.webp.b64
          test -s site/anatomy/assets/male-back.webp.b64

      - name: Validate recovery preview contract
        run: test -f site/tests/auth-recovery-preview-static.test.mjs

      - name: Run static safety test
        working-directory: site
        run: node tests/auth-recovery-preview-static.test.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy isolated preview
        id: deployment
        uses: actions/deploy-pages@v4
